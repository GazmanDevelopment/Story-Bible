<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; font: 13px/1.4 Arial, sans-serif; }
    #pane { border: 0; width: 100%; height: 100%; display: block; }
    #hint { display: none; padding: 12px; color: #a00; }
  </style>
</head>
<body>
  <p id="hint">
    The Story Bible pane hasn't loaded. Check that the server is reachable
    from this browser, then reopen the sidebar.
  </p>
  <iframe id="pane" title="Story Bible"></iframe>
  <script>
    // The server URL comes from Code.gs, serialised as a JS string (never
    // spliced into HTML).
    var SERVER = <?!= JSON.stringify(serverUrl) ?>;
    var frame = document.getElementById('pane');
    var loaded = false;
    frame.addEventListener('load', function () { loaded = true; });
    // gdocs.html, not index.html: same pane, minus Office.js (which blanks a framed page).
    frame.src = SERVER + '/gdocs.html';
    setTimeout(function () {
      if (!loaded) document.getElementById('hint').style.display = 'block';
    }, 10000);
  </script>
</body>
</html>
