name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neither job pushes anything or calls the GitHub API - checkout and a local
# docker build only need to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # matches the python:3.12-slim target in the Dockerfile (#1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check (catches syntax errors)
        run: python -m compileall -q app tests scripts run_demo.py make_samples.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Manifests match the template, and validate (#8)
        run: |
          python scripts/generate_manifest.py
          # Fails if committed manifest.dev.xml/manifest.prod.xml don't
          # exactly match what the template+script would produce right now
          # - i.e. someone hand-edited the output instead of the template.
          git diff --exit-code manifest.dev.xml manifest.prod.xml
          npx --yes office-addin-manifest validate manifest.dev.xml
          npx --yes office-addin-manifest validate manifest.prod.xml

      - name: Run tests
        run: |
          # tests/test_ui.py is a Playwright script, not a pytest suite - it
          # runs at import time and expects a live server + sys.argv. Folding
          # it into this suite properly is tracked in #15.
          python -m pytest tests/ --ignore=tests/test_ui.py -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t story-bible:ci .

      - name: Validate deploy/compose.yaml (#6)
        # Self-contained (no env_file - #36), so no setup needed beforehand.
        run: docker compose -f deploy/compose.yaml config

      - name: Container starts and reports healthy
        run: |
          docker run -d --name sb -p 8000:8000 -v sb-data:/data story-bible:ci
          # The Dockerfile's HEALTHCHECK only runs its first probe after
          # --interval (30s), so poll well past that (90s) rather than a
          # tight loop that can false-fail before Docker has checked at all.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sb 2>/dev/null || echo starting)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker logs sb; exit 1; }
            sleep 3
          done
          echo "never became healthy"; docker logs sb; exit 1
