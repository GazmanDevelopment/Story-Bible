name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neither job pushes anything or calls the GitHub API - checkout and a local
# docker build only need to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # matches the python:3.12-slim target in the Dockerfile (#1)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache Playwright's browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      # Cache hit still needs the (fast) apt-get portion of --with-deps -
      # only the Chromium download itself is what the cache actually saves.
      - name: Install Playwright's browser (#15 - tests/test_ui.py)
        run: playwright install --with-deps chromium

      - name: Compile check (catches syntax errors)
        run: python -m compileall -q app tests scripts run_demo.py make_samples.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Manifests match the template, and validate (#8, #61)
        run: |
          python scripts/generate_manifest.py
          # Fails if committed manifest.dev.xml/manifest.prod.xml, or the
          # GitHub Pages copy at docs/manifest.xml (#61), don't exactly
          # match what the template+script would produce right now - i.e.
          # someone hand-edited the output instead of the template.
          git diff --exit-code manifest.dev.xml manifest.prod.xml docs/manifest.xml
          npx --yes office-addin-manifest validate manifest.dev.xml
          npx --yes office-addin-manifest validate manifest.prod.xml

      - name: Run tests
        run: python -m pytest tests/ -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Simulate a restrictive build-host umask (regression guard, #40)
        # A real TrueNAS deploy failed at container startup with
        # PermissionError reading app/__init__.py: `sudo git clone`/`pull`
        # there used a restrictive umask, and Docker's COPY preserves the
        # *source* file's mode bits, not just its content - GitHub Actions'
        # own checkout uses a normal umask, so this job wouldn't otherwise
        # exercise the exact scenario that broke. Reproduces a umask-077
        # checkout (files 600, dirs 700 - owner/root can still read them,
        # which is why `docker build` itself succeeded on the real box too;
        # only the non-root runtime user couldn't) before building, so a
        # regression is caught here instead of on a real deploy again.
        run: |
          find app -type f -exec chmod 600 {} +
          find app -type d -exec chmod 700 {} +

      - name: Build image
        run: docker build -t story-bible:ci .

      - name: Validate deploy/compose.yaml.example (#6)
        # Self-contained (no env_file - #36), so no setup needed beforehand.
        # The real deploy/compose.yaml is gitignored (#38) - nothing to
        # check out in CI, so this validates the tracked template instead.
        run: docker compose -f deploy/compose.yaml.example config

      - name: Container starts and reports healthy
        run: |
          docker run -d --name sb -p 8000:8000 -v sb-data:/data story-bible:ci
          # The Dockerfile's HEALTHCHECK only runs its first probe after
          # --interval (30s), so poll well past that (90s) rather than a
          # tight loop that can false-fail before Docker has checked at all.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sb 2>/dev/null || echo starting)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker logs sb; exit 1; }
            sleep 3
          done
          echo "never became healthy"; docker logs sb; exit 1
