name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches the python:3.12-slim target in PLAN.md's Dockerfile (#1)

      # No requirements.txt yet (tracked in #1); pin the same versions verified
      # locally until that lands, then switch this to `pip install -r requirements.txt`.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.141.1 uvicorn==0.54.0 pydantic==2.13.4 \
                      pytest==9.1.1 httpx==0.28.1

      - name: Compile check (catches syntax errors)
        run: python -m compileall -q app tests run_demo.py make_samples.py

      - name: Validate manifest.xml is well-formed
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('manifest.xml')"

      - name: Run tests
        run: |
          # tests/test_ui.py is a Playwright script, not a pytest suite - it
          # runs at import time and expects a live server + sys.argv. Folding
          # it into this suite properly is tracked in #15.
          python -m pytest tests/ --ignore=tests/test_ui.py -v
