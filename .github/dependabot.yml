# Dependabot version updates (#74): weekly PRs for the three things this repo
# pins - Python packages, the Docker base image (digest), and GitHub Actions
# (commit SHAs). Minor/patch bumps are grouped into one PR per ecosystem so a
# quiet week is one review, not eight.
#
# Two things to know when one of these PRs arrives:
#  - a Python bump changes what the third-party notices file says, and CI checks
#    it is current: run `python scripts/generate_third_party_notices.py` on the
#    PR branch and commit the result.
#  - the vendored JavaScript (app/static/vendor/) is NOT covered by Dependabot -
#    it's copied files, not a package manifest. It is checked weekly by
#    .github/workflows/security-audit.yml instead.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Stay on the Python line the app is developed and tested on (3.12): CI runs
    # on 3.12, so an image on 3.14 would no longer be what was tested. Digest
    # refreshes of python:3.12-slim - the security patches - still arrive as
    # normal. Moving to a new Python line is a deliberate change: update the
    # Dockerfile, every setup-python in .github/workflows, and check the
    # dependencies together (tests/test_supply_chain.py enforces they agree),
    # then remove this rule.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
