<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Bible</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <!-- Quill (vendored, not CDN - this app is meant to run LAN/VPN-only). See
       app/static/vendor/quill/NOTICE.md for version/license (BSD-3-Clause). -->
  <link rel="stylesheet" href="vendor/quill/quill.snow.css">
  <!-- Office.js. Outside Word the page still works as a normal web app. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="vendor/quill/quill.js"></script>
  <!-- MSAL.js (vendored, not CDN - see app/static/vendor/msal/NOTICE.md,
       MIT). Sign-in for AUTH_MODE=entra (#13); harmless to load when
       AUTH_MODE is "none"/"token" - just never used. -->

</head>
<body>
  <header id="top">
    <div class="row">
      <select id="seriesSelect" title="Series"></select>
      <button id="btnFind" class="icon word-only" title="Look up the selected name in the document">Find</button>
    </div>
    <div id="authBar" class="linkbar"></div>
    <div id="linkBar" class="linkbar word-only"></div>
    <nav id="tabs">
      <button data-tab="characters">Characters</button>
      <button data-tab="locations">Places</button>
      <button data-tab="events">Timeline</button>
      <button data-tab="research">Research</button>
      <button data-tab="series">Series</button>
    </nav>
  </header>
  <main id="main"></main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
